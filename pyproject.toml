[project]
name = "eye-mouse-lab"
version = "0.1.0"
description = "Local webcam gaze calibration and measurement laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mediapipe>=0.10.30,<0.11",
  "opencv-contrib-python>=4.11,<5",
  "numpy>=2,<3",
  "matplotlib>=3.9,<4",
  "PySide6>=6.8,<7",
  "python-xlib>=0.33,<0.34; sys_platform == 'linux'",
]

[project.scripts]
eye-mouse = "eye_mouse.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eye_mouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
